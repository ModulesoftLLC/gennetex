name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
jobs:
  build:
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-15
            args: '--target aarch64-apple-darwin'
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './desktop/src-tauri -> target' }
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          VITE_EMPLOYEE_AUTH_API_URL: https://adiya.site/api/employee-auth
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 'Gennetex ERP Desktop v__VERSION__'
          releaseBody: 'Windows and macOS enterprise desktop release.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.local.conf.json
      - name: Collect Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/windows | Out-Null
          Get-ChildItem desktop/src-tauri/target/release/bundle -Recurse -File |
            Where-Object Extension -in '.exe','.msi' |
            Copy-Item -Destination desktop/windows -Force
      - name: Collect macOS installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p desktop/macos
          find desktop/src-tauri/target -type f -name '*.dmg' -exec cp {} desktop/macos/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: gennetex-${{ matrix.platform }}-installers
          path: |
            desktop/windows/*.exe
            desktop/windows/*.msi
            desktop/macos/*.dmg
          if-no-files-found: error
